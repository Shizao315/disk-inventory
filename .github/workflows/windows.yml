name: Windows build and test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/sign-release.yml'
      - 'src/**'
      - 'tests/**'
      - 'signing/**'
      - 'tools/**'
      - 'RUN_DEV_SCAN.cmd'
      - 'RUN_DESKTOP.cmd'
      - 'requirements-desktop.txt'
      - 'build.ps1'
      - 'setup-toolchain.ps1'
  pull_request:
    paths:
      - '.github/workflows/windows.yml'
      - '.github/workflows/sign-release.yml'
      - 'src/**'
      - 'tests/**'
      - 'signing/**'
      - 'tools/**'
      - 'RUN_DEV_SCAN.cmd'
      - 'RUN_DESKTOP.cmd'
      - 'requirements-desktop.txt'
      - 'build.ps1'
      - 'setup-toolchain.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download and verify official Zig compiler
        run: ./setup-toolchain.ps1
      - name: Build standalone Windows executable
        run: ./build.ps1
      - name: Scan synthetic fixtures and test native GUI
        run: python -B tests/integration.py
      - name: Install pinned browser test library
        run: npm install --no-save --ignore-scripts playwright@1.62.1 --registry=https://registry.npmjs.org
      - name: Test offline report in Edge
        run: ./tests/run-browser.ps1
      - name: Test Python source scanner and development window
        run: python -B tests/test_dev_scan.py
      - name: Test source-generated offline report in Edge
        run: ./tests/run-browser.ps1 -ReportDirectory test-output/dev
      - name: Save unsigned executable and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventory-win64-unsigned
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/DiskInventory.exe
            test-output/integration-results.json
            test-output/browser-results.json
            test-output/report-desktop.png
            test-output/folder-ranking.png
            test-output/dev/dev-integration-results.json
            test-output/dev/browser-results.json
            test-output/dev/report-desktop.png
            test-output/dev/folder-ranking.png

  desktop-prototype:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned optional desktop prototype library
        run: python -m pip install --disable-pip-version-check -r requirements-desktop.txt --index-url https://pypi.org/simple
      - name: Test actual embedded report and current-directory watcher
        run: python -X utf8 -B tests/test_desktop_viewer.py
      - name: Save desktop prototype verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DiskInventory-desktop-prototype-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-output/desktop/desktop-results.json
            test-output/desktop/embedded-desktop.png
            test-output/desktop/embedded-scan-form.png
            test-output/desktop/embedded-folder-ranking.png
